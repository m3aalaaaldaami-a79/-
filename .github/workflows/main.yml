name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 1. حل مشكلة debug.keystore بإنشائه قبل عملية البناء وفي المسار المطلوب
      - name: Generate Debug Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p app
          cp debug.keystore app/debug.keystore

      # 2. حل مشكلة default_web_client_id إذا لم يكن ملف google-services.json مرفوعاً
      - name: Inject default_web_client_id if missing
        run: |
          mkdir -p app/src/main/res/values
          if [ ! -f app/google-services.json ]; then
            cat << 'EOF' > app/src/main/res/values/google_auth.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="default_web_client_id" translatable="false">${{ secrets.WEB_CLIENT_ID || '000000000000-placeholder.apps.googleusercontent.com' }}</string>
          </resources>
          EOF
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
