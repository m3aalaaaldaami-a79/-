name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Locate Project, Keystore, and Build APK
        run: |
          # البحث عن مجلد المشروع الذي يحتوي على build.gradle أو build.gradle.kts
          PROJECT_DIR=$(find . -maxdepth 3 -name "settings.gradle*" -exec dirname {} \; | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="."
          fi
          echo "Project directory found at: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # 1. إنشاء debug.keystore في مسار المشروع ومجلد app
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p app
          cp debug.keystore app/debug.keystore

          # 2. حقن default_web_client_id إذا كان ملف google-services.json غير موجود
          mkdir -p app/src/main/res/values
          if [ ! -f app/google-services.json ]; then
            cat << 'EOF' > app/src/main/res/values/google_auth.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="default_web_client_id" translatable="false">${{ secrets.WEB_CLIENT_ID || '000000000000-placeholder.apps.googleusercontent.com' }}</string>
          </resources>
          EOF
          fi

          # 3. تشغيل gradlew إذا كان موجوداً، أو استخدام gradle المثبت في النظام لتوليده وبناء التطبيق
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle wrapper
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
